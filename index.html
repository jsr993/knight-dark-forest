<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Рыцарь — Тёмный лес</title>

  <!-- Описание для поисковиков и ссылок в соцсетях -->
  <meta name="description" content="Пиксельный платформер в духе Dendy: рыцарь пробивается через мрачный лес к воротам замка. Тёмные рыцари, зомби, привидения и босс-огр.">
  <meta name="theme-color" content="#0d1319">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Рыцарь — Тёмный лес">
  <meta property="og:description" content="Пиксельный платформер в духе Dendy: рыцарь пробивается через мрачный лес к воротам замка.">
  <meta name="twitter:card" content="summary">

  <!-- Иконка вкладки: меч, нарисованный прямо в адресе (без отдельного файла) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230d1319'/><rect x='7' y='2' width='2' height='9' fill='%23dfe7ee'/><rect x='5' y='10' width='6' height='2' fill='%23c9a227'/><rect x='7' y='12' width='2' height='3' fill='%238a6a3f'/></svg>">

  <style>
    /* Чёрные поля вокруг игры, канвас на весь экран */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      /* Игра пиксельная — текст выделять незачем, а случайное выделение мешает */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; }

    /* Подсказка для тех, кто зашёл с телефона: игра клавиатурная */
    #no-keyboard {
      display: none;
      position: fixed;
      inset: 0;
      background: #0d1319;
      color: #c8d3e0;
      font-family: system-ui, sans-serif;
      text-align: center;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    #no-keyboard b { color: #f2c14e; }
    /* Показываем подсказку только на устройствах без мыши/клавиатуры */
    @media (pointer: coarse) and (max-width: 900px) {
      #no-keyboard { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>

  <div id="no-keyboard">
    <div>
      <p><b>Рыцарь — Тёмный лес</b></p>
      <p>Игра управляется клавиатурой, поэтому её лучше открыть<br>на компьютере или ноутбуке.</p>
      <p>Стрелки — бег, Пробел — прыжок, X — удар мечом.</p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
